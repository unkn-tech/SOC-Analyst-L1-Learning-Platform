<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Academy — Become a Job-Ready SOC Analyst L1</title>
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-tertiary: #1a2234;
    --bg-card: #161f33;
    --border: #243049;
    --text-primary: #e6edf3;
    --text-secondary: #9aa7bd;
    --text-muted: #6b7690;
    --accent: #00d9ff;
    --accent-dim: #0891b2;
    --green: #00ff88;
    --green-dim: #10b981;
    --yellow: #fbbf24;
    --red: #ff3860;
    --orange: #fb923c;
    --purple: #a78bfa;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "SF Mono", Monaco, "Cascadia Code", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }
  code, pre, .mono { font-family: var(--font-mono); }
  pre {
    background: #05080f;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    color: #c9d6e8;
  }
  code.inline {
    background: #0a1220;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    color: var(--accent);
  }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 260px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-logo .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--green));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #000;
  }
  .sidebar-logo h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .sidebar-logo .tag {
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 1px;
  }
  .nav-section {
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); text-decoration: none; }
  .nav-item.active {
    background: rgba(0, 217, 255, 0.08);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .nav-item .nav-icon { width: 18px; text-align: center; font-size: 14px; }

  .main {
    flex: 1;
    min-width: 0;
    padding: 28px 36px 60px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    gap: 16px;
  }
  .search-bar {
    flex: 1;
    max-width: 500px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 14px 10px 38px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .search-bar input:focus { outline: none; border-color: var(--accent); }
  .search-bar::before {
    content: "⌕";
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
  }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-secondary);
    padding: 6px 14px 6px 6px;
    border-radius: 30px;
    border: 1px solid var(--border);
  }
  .user-avatar {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #000; font-size: 13px;
  }
  .user-chip .user-name { font-size: 13px; font-weight: 600; }
  .user-chip .user-streak { font-size: 11px; color: var(--yellow); }

  /* Components */
  .page-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .page-subtitle {
    color: var(--text-secondary);
    margin-bottom: 28px;
    font-size: 15px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
  }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #33e2ff; text-decoration: none; }
  .btn-secondary {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: #22304a; text-decoration: none; }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
  }
  .btn-ghost:hover { color: var(--text-primary); text-decoration: none; }
  .btn-success { background: var(--green-dim); color: #000; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-low { background: rgba(0, 255, 136, 0.15); color: var(--green); }
  .badge-medium { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
  .badge-high { background: rgba(255, 56, 96, 0.15); color: var(--red); }
  .badge-critical { background: var(--red); color: #fff; }
  .badge-info { background: rgba(0, 217, 255, 0.15); color: var(--accent); }
  .badge-purple { background: rgba(167, 139, 250, 0.15); color: var(--purple); }

  .progress-bar {
    height: 8px;
    background: var(--bg-tertiary);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 4px;
    transition: width 0.4s;
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  /* Landing page */
  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    background: radial-gradient(ellipse at top, rgba(0, 217, 255, 0.12), transparent 60%);
    border-radius: 12px;
    margin-bottom: 40px;
    border: 1px solid var(--border);
  }
  .hero h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    font-size: 18px;
    color: var(--text-secondary);
    max-width: 700px;
    margin: 0 auto 28px;
  }
  .hero-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 40px;
  }
  .feature {
    padding: 22px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .feature-icon {
    width: 44px; height: 44px;
    background: rgba(0, 217, 255, 0.12);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin-bottom: 12px;
  }
  .feature h3 { font-size: 15px; margin-bottom: 6px; }
  .feature p { font-size: 13px; color: var(--text-secondary); }

  /* Roadmap */
  .roadmap { position: relative; padding-left: 30px; }
  .roadmap::before {
    content: "";
    position: absolute;
    left: 14px; top: 0; bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .roadmap-item {
    position: relative;
    margin-bottom: 14px;
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .roadmap-item:hover { border-color: var(--accent); transform: translateX(4px); }
  .roadmap-item::before {
    content: "";
    position: absolute;
    left: -22px; top: 22px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    border: 2px solid var(--border);
  }
  .roadmap-item.completed::before { background: var(--green); border-color: var(--green); }
  .roadmap-item.in-progress::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0, 217, 255, 0.2); }
  .roadmap-item.locked { opacity: 0.55; cursor: not-allowed; }
  .roadmap-item .level-tag {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .roadmap-item h3 { font-size: 16px; margin-bottom: 4px; }
  .roadmap-item p { font-size: 13px; color: var(--text-secondary); }

  /* Module/Lesson */
  .lesson-content {
    max-width: 900px;
  }
  .lesson-content h2 {
    font-size: 22px;
    margin: 28px 0 14px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .lesson-content h3 {
    font-size: 17px;
    margin: 20px 0 10px;
  }
  .lesson-content p { margin-bottom: 12px; color: var(--text-secondary); }
  .lesson-content ul, .lesson-content ol {
    margin: 0 0 14px 22px;
    color: var(--text-secondary);
  }
  .lesson-content li { margin-bottom: 6px; }
  .lesson-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    background: var(--bg-secondary);
    border-radius: 8px;
    overflow: hidden;
  }
  .lesson-content th, .lesson-content td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .lesson-content th {
    background: var(--bg-tertiary);
    font-weight: 600;
    color: var(--text-primary);
  }
  .callout {
    padding: 14px 18px;
    border-radius: 8px;
    margin: 16px 0;
    border-left: 4px solid;
  }
  .callout-info { background: rgba(0, 217, 255, 0.08); border-color: var(--accent); }
  .callout-warn { background: rgba(251, 191, 36, 0.08); border-color: var(--yellow); }
  .callout-danger { background: rgba(255, 56, 96, 0.08); border-color: var(--red); }
  .callout-success { background: rgba(0, 255, 136, 0.08); border-color: var(--green); }
  .callout strong { color: var(--text-primary); }

  .analogy-box {
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.1), rgba(0, 217, 255, 0.05));
    border: 1px solid rgba(167, 139, 250, 0.3);
    padding: 16px 20px;
    border-radius: 10px;
    margin: 16px 0;
  }
  .analogy-box .label {
    font-size: 11px;
    color: var(--purple);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  /* Quiz */
  .quiz-question {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .quiz-question .q-num {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .quiz-question .q-text {
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 16px;
  }
  .quiz-option {
    display: block;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    text-align: left;
    width: 100%;
    color: var(--text-primary);
  }
  .quiz-option:hover { border-color: var(--accent); background: var(--bg-tertiary); }
  .quiz-option.selected { border-color: var(--accent); background: rgba(0, 217, 255, 0.1); }
  .quiz-option.correct { border-color: var(--green); background: rgba(0, 255, 136, 0.1); }
  .quiz-option.incorrect { border-color: var(--red); background: rgba(255, 56, 96, 0.1); }
  .quiz-explanation {
    margin-top: 14px;
    padding: 12px 16px;
    background: rgba(0, 217, 255, 0.06);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* Alert cards */
  .alert-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .alert-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .alert-card.severity-high { border-left: 4px solid var(--red); }
  .alert-card.severity-medium { border-left: 4px solid var(--yellow); }
  .alert-card.severity-low { border-left: 4px solid var(--green); }
  .alert-card.severity-critical { border-left: 4px solid var(--red); background: rgba(255, 56, 96, 0.04); }
  .alert-severity {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .alert-severity.high, .alert-severity.critical { background: rgba(255, 56, 96, 0.2); color: var(--red); }
  .alert-severity.medium { background: rgba(251, 191, 36, 0.2); color: var(--yellow); }
  .alert-severity.low { background: rgba(0, 255, 136, 0.2); color: var(--green); }
  .alert-body { flex: 1; min-width: 0; }
  .alert-title { font-weight: 600; margin-bottom: 4px; }
  .alert-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .alert-meta span::before { content: "•"; margin-right: 8px; color: var(--border); }
  .alert-meta span:first-child::before { display: none; }

  /* Log viewer */
  .log-viewer {
    background: #05080f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    overflow-x: auto;
    max-height: 400px;
    overflow-y: auto;
  }
  .log-line { white-space: pre-wrap; word-break: break-word; }
  .log-line .ts { color: #6b7690; }
  .log-line .ip { color: var(--accent); }
  .log-line .user { color: var(--yellow); }
  .log-line .action-fail { color: var(--red); }
  .log-line .action-success { color: var(--green); }
  .log-line .action-warn { color: var(--orange); }

  /* Flashcard */
  .flashcard {
    background: linear-gradient(135deg, var(--bg-card), var(--bg-tertiary));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 30px;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: transform 0.4s;
    perspective: 1000px;
  }
  .flashcard.flipped { background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-card)); }
  .flashcard-label {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 18px;
  }
  .flashcard-text {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.5;
  }
  .flashcard-hint {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .tab {
    padding: 10px 18px;
    font-size: 14px;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    font-weight: 500;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
  }
  .modal h2 { margin-bottom: 16px; }

  /* Utilities */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 12px; }
  .mt-4 { margin-top: 16px; }
  .mb-2 { margin-bottom: 8px; }
  .mb-3 { margin-bottom: 12px; }
  .mb-4 { margin-bottom: 16px; }
  .text-muted { color: var(--text-muted); }
  .text-sm { font-size: 13px; }
  .text-xs { font-size: 11px; }
  .font-mono { font-family: var(--font-mono); }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main { padding: 20px; }
    .hero h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

    "m0-l1": {
      moduleId: "m0", title: "What is Cybersecurity?", difficulty: "beginner",
      content: `
<h2>1. Aim</h2>
<p>Understand what cybersecurity means, why it exists, and how it relates to the work of a SOC analyst.</p>

<h2>2. Why SOC Analysts Need It</h2>
<p>Every alert you investigate, every log you read, and every decision you make in a SOC is grounded in the goals of cybersecurity: protecting information and systems from unauthorized access, misuse, or destruction.</p>

<h2>3. Beginner Explanation</h2>
<p>Imagine your house. You have a front door with a lock, windows with curtains, and maybe a security camera. <strong>Cybersecurity</strong> is the same idea — but for computers, networks, and the data they hold. It's the practice of protecting digital systems from people who want to steal, damage, or spy on them.</p>

<div class="analogy-box">
  <div class="label">REAL-WORLD ANALOGY</div>
  A bank protects money with walls, guards, cameras, and vaults. Cybersecurity protects data with firewalls, encryption, monitoring, and access controls.
</div>

<h2>4. Technical Explanation</h2>
<p>Cybersecurity (also called information security or InfoSec) is the practice of protecting systems, networks, programs, and data from <strong>digital attacks</strong>. These attacks usually aim to:</p>
<ul>
  <li>Access sensitive information without authorization</li>
  <li>Alter or destroy data</li>
  <li>Extort money from users or organizations</li>
  <li>Disrupt normal business operations</li>
</ul>

<h2>5. The CIA Triad</h2>
<p>The foundation of all cybersecurity is the <strong>CIA Triad</strong>:</p>
<table>
  <tr><th>Principle</th><th>Meaning</th><th>Example</th></tr>
  <tr><td><strong>Confidentiality</strong></td><td>Only authorized people can see the data</td><td>Encrypted files, passwords</td></tr>
  <tr><td><strong>Integrity</strong></td><td>Data cannot be changed by unauthorized users</td><td>Checksums, digital signatures</td></tr>
  <tr><td><strong>Availability</strong></td><td>Systems and data are accessible when needed</td><td>Backups, DDoS protection</td></tr>
</table>

<h2>6. SOC Scenario</h2>
<p>You're on shift and get an alert: <em>"Unusual file access on finance server."</em> Your job is to figure out whether this is a violation of <strong>confidentiality</strong> (someone reading files they shouldn't), <strong>integrity</strong> (someone modifying files), or <strong>availability</strong> (someone trying to take the server down).</p>

<h2>7. Quick Revision</h2>
<ul>
  <li>Cybersecurity protects systems, networks, and data from attacks.</li>
  <li>The CIA Triad: Confidentiality, Integrity, Availability.</li>
  <li>Every SOC alert maps to a violation (or potential violation) of one or more CIA principles.</li>
  <li>Cybersecurity is a continuous process, not a one-time setup.</li>
  <li>SOC analysts are the defenders — the "blue team."</li>
</ul>`
    },

      moduleId: "m0", title: "Threats, Vulnerabilities & Risk", difficulty: "beginner",
      content: `
<h2>1. Aim</h2>
<p>Learn the difference between a threat, a vulnerability, and a risk — three terms you'll hear every day in a SOC.</p>

<h2>2. Why SOC Analysts Need It</h2>
<p>When you investigate an alert, you're often answering: "Was there a threat? Did it exploit a vulnerability? What was the risk?" Mixing these up leads to wrong severity ratings and bad decisions.</p>

<h2>3. Beginner Explanation</h2>
<div class="analogy-box">
  <div class="label">REAL-WORLD ANALOGY</div>
  <strong>Threat:</strong> A burglar walking around your neighborhood.<br>
  <strong>Vulnerability:</strong> Your front door has a broken lock.<br>
  <strong>Risk:</strong> The chance the burglar gets in because of the broken lock.
</div>

<h2>4. Technical Definitions</h2>
<table>
  <tr><th>Term</th><th>Definition</th><th>Example</th></tr>
  <tr><td><strong>Threat</strong></td><td>Anything that can cause harm by exploiting a weakness</td><td>Ransomware gang, malicious insider, flood</td></tr>
  <tr><td><strong>Vulnerability</strong></td><td>A weakness in a system, process, or control</td><td>Unpatched software, weak password, open port</td></tr>
  <tr><td><strong>Risk</strong></td><td>The potential for loss when a threat exploits a vulnerability</td><td>Risk = Threat × Vulnerability × Impact</td></tr>
  <tr><td><strong>Exploit</strong></td><td>The actual method used to take advantage of a vulnerability</td><td>A specific piece of malware or attack code</td></tr>
  <tr><td><strong>Attack</strong></td><td>An active attempt to breach security</td><td>Phishing email sent to employees</td></tr>
</table>

<h2>5. Event vs Alert vs Incident</h2>
<p>These three are often confused. Here's the difference:</p>
<table>
  <tr><th>Term</th><th>Meaning</th></tr>
  <tr><td><strong>Event</strong></td><td>Any observable occurrence in a system (a user logged in, a file was accessed)</td></tr>
  <tr><td><strong>Alert</strong></td><td>An event flagged as potentially suspicious by a rule or analyst</td></tr>
  <tr><td><strong>Incident</strong></td><td>A confirmed violation of security policy or a real attack</td></tr>
</table>

<div class="callout callout-info">
  <strong>Remember:</strong> Every incident starts as an event. Some events become alerts. Some alerts become incidents. Most alerts are false positives — that's why triage exists.
</div>

<h2>6. SOC Scenario</h2>
<p>You see 50 failed login attempts from IP <code class="inline">185.220.101.42</code> against user <code class="inline">admin</code>. Ask yourself:</p>
<ul>
  <li><strong>Threat:</strong> A brute-force attacker (possibly a botnet).</li>
  <li><strong>Vulnerability:</strong> Weak password policy, no account lockout, public RDP.</li>
  <li><strong>Risk:</strong> High — if the attacker guesses the password, they gain admin access.</li>
  <li><strong>Event:</strong> Each failed login.</li>
  <li><strong>Alert:</strong> The SIEM rule that triggered.</li>
  <li><strong>Incident:</strong> Only if a successful login is found afterward.</li>
</ul>

<h2>7. Quick Revision</h2>
<ul>
  <li>Threat = who/what wants to harm you.</li>
  <li>Vulnerability = your weakness.</li>
  <li>Risk = what happens if the threat uses the weakness.</li>
  <li>Event → Alert → Incident is the SOC pipeline.</li>
  <li>Most alerts are false positives — verify before escalating.</li>
</ul>`
    },
    "m1-l1": {
      moduleId: "m1", title: "IP Addresses, Ports & Protocols", difficulty: "beginner",
      content: `
<h2>1. Aim</h2>
<p>Understand IP addresses, ports, and protocols — the language of every network log you'll read as a SOC analyst.</p>

<h2>2. Why SOC Analysts Need It</h2>
<p>Every firewall log, every SIEM alert, every packet capture mentions IPs and ports. If you can't read them, you can't investigate anything.</p>

<h2>3. Beginner Explanation</h2>
<div class="analogy-box">
  <div class="label">REAL-WORLD ANALOGY</div>
  Think of the internet like the postal system:<br>
  • <strong>IP address</strong> = a house address (where data goes)<br>
  • <strong>Port</strong> = a specific door or mailbox at that house (which service receives it)<br>
  • <strong>Protocol</strong> = the language the letter is written in (how data is formatted)
</div>

<h2>4. IP Addresses</h2>
<p>An <strong>IP address</strong> uniquely identifies a device on a network.</p>
<ul>
  <li><strong>IPv4:</strong> <code class="inline">192.168.1.10</code> (32-bit, ~4 billion addresses)</li>
  <li><strong>IPv6:</strong> <code class="inline">2001:0db8:85a3::8a2e:0370:7334</code> (128-bit, practically unlimited)</li>
  <li><strong>Private IPs:</strong> <code class="inline">10.x.x.x</code>, <code class="inline">172.16-31.x.x</code>, <code class="inline">192.168.x.x</code> — used inside networks, not routable on the internet.</li>
  <li><strong>Public IPs:</strong> Routable on the internet. Assigned by your ISP.</li>
</ul>

<h2>5. Ports</h2>
<p>A <strong>port</strong> is a number (0–65535) that identifies a specific service on a device.</p>
<table>
  <tr><th>Port</th><th>Protocol</th><th>Use</th></tr>
  <tr><td>21</td><td>FTP</td><td>File transfer</td></tr>
  <tr><td>22</td><td>SSH</td><td>Secure remote login</td></tr>
  <tr><td>23</td><td>Telnet</td><td>Unencrypted remote login (insecure)</td></tr>
  <tr><td>25</td><td>SMTP</td><td>Email sending</td></tr>
  <tr><td>53</td><td>DNS</td><td>Domain name resolution</td></tr>
  <tr><td>80</td><td>HTTP</td><td>Unencrypted web traffic</td></tr>
  <tr><td>110</td><td>POP3</td><td>Email receiving</td></tr>
  <tr><td>143</td><td>IMAP</td><td>Email receiving</td></tr>
  <tr><td>443</td><td>HTTPS</td><td>Encrypted web traffic</td></tr>
  <tr><td>445</td><td>SMB</td><td>Windows file sharing</td></tr>
  <tr><td>3389</td><td>RDP</td><td>Remote desktop</td></tr>
</table>

<h2>6. Protocols</h2>
<p>A <strong>protocol</strong> is a set of rules for communication.</p>
<ul>
  <li><strong>TCP</strong> — reliable, connection-oriented (like a phone call). Used for HTTP, SSH, email.</li>
  <li><strong>UDP</strong> — fast, connectionless (like sending a letter). Used for DNS, streaming, VoIP.</li>
  <li><strong>ICMP</strong> — used for diagnostics (ping, traceroute).</li>
</ul>

<h2>7. The TCP 3-Way Handshake</h2>
<p>Every TCP connection starts with three steps:</p>
<pre>Client          Server
  |---SYN--------&gt;|     (1) "I want to connect"
  |&lt;--SYN-ACK-----|     (2) "OK, I'm ready"
  |---ACK---------&gt;|     (3) "Great, let's talk"</pre>

<h2>8. SOC Scenario</h2>
<p>You see this firewall log:</p>
<pre>2026-09-20 14:22:11  src=203.0.113.45  dst=10.0.1.25  proto=TCP  sport=44321  dport=445  action=ALLOW</pre>
<p>What does this tell you?</p>
<ul>
  <li>An external IP (<code class="inline">203.0.113.45</code>) is connecting to an internal machine.</li>
  <li>Destination port <strong>445</strong> = SMB (Windows file sharing).</li>
  <li>This is suspicious — SMB should rarely be exposed to the internet.</li>
  <li>Next steps: check what the external IP is, check the internal host, look for related events.</li>
</ul>

<h2>9. Quick Revision</h2>
<ul>
  <li>IP = address of a device. Port = specific service on that device.</li>
  <li>Memorize common ports: 22, 53, 80, 443, 445, 3389.</li>
  <li>TCP is reliable; UDP is fast.</li>
  <li>Private IPs (10.x, 172.16-31.x, 192.168.x) are internal-only.</li>
  <li>Unexpected ports in logs = a place to start investigating.</li>
</ul>`
    },
    "m4-l1": {
      moduleId: "m4", title: "Reading Security Logs", difficulty: "beginner",
      content: `
<h2>1. Aim</h2>
<p>Learn how to read and interpret security logs — the single most important skill for a SOC L1 analyst.</p>

<h2>2. Why SOC Analysts Need It</h2>
<p>Logs are the evidence. Every investigation, every triage decision, every escalation starts with reading logs correctly. If you can't read them, you can't do the job.</p>

<h2>3. Beginner Explanation</h2>
<p>A <strong>log</strong> is simply a record of something that happened. Your phone keeps logs of calls. A bank keeps logs of transactions. Computers keep logs of everything: logins, file access, network connections, errors, and more.</p>

<div class="analogy-box">
  <div class="label">REAL-WORLD ANALOGY</div>
  A security guard's notebook at a building entrance: who came in, what time, which door, what they were carrying. Logs are the digital version of that notebook.
</div>

<h2>4. Common Log Fields</h2>
<table>
  <tr><th>Field</th><th>Meaning</th><th>Example</th></tr>
  <tr><td>Timestamp</td><td>When the event happened</td><td>2026-09-20 09:42:31</td></tr>
  <tr><td>Source IP</td><td>Where the event came from</td><td>185.220.101.42</td></tr>
  <tr><td>Destination IP</td><td>Where the event was going</td><td>10.0.1.25</td></tr>
  <tr><td>Username</td><td>Who performed the action</td><td>admin</td></tr>
  <tr><td>Hostname</td><td>Which device</td><td>WS-FINANCE-01</td></tr>
  <tr><td>Port</td><td>Which service</td><td>445</td></tr>
  <tr><td>Protocol</td><td>TCP/UDP/etc</td><td>TCP</td></tr>
  <tr><td>Action</td><td>What happened</td><td>ALLOW / DENY / FAILED</td></tr>
  <tr><td>Event ID</td><td>Windows-specific code</td><td>4625</td></tr>
</table>

<h2>5. A Real Windows Logon Failure</h2>
<pre>LogName: Security
Source: Microsoft-Windows-Security-Auditing
Date: 2026-09-20T09:42:31.445Z
EventID: 4625
Level: Information
Computer: DC01.corp.local
Message:
  An account failed to log on.

  Subject:
    Security ID: NULL SID
    Account Name: -
  Logon Type: 3
  Account For Which Logon Failed:
    Security ID: NULL SID
    Account Name: admin
    Account Domain: CORP
  Failure Information:
    Failure Reason: Unknown user name or bad password.
    Status: 0xC000006D
    Sub Status: 0xC000006A
  Network Information:
    Workstation Name: -
    Source Network Address: 185.220.101.42
    Source Port: 52144</pre>

<h2>6. What to Notice</h2>
<ul>
  <li><strong>EventID 4625</strong> = failed logon. This is the #1 event for brute-force detection.</li>
  <li><strong>Account Name: admin</strong> — attacker is targeting a privileged account.</li>
  <li><strong>Failure Reason: Unknown user name or bad password</strong> — classic credential attack.</li>
  <li><strong>Source Network Address: 185.220.101.42</strong> — external IP. Look it up in threat intel.</li>
  <li><strong>Logon Type 3</strong> = network logon (not interactive). Typical of remote attacks.</li>
</ul>

<h2>7. Hands-on Task</h2>
<p>Look at this log and answer the questions:</p>
<pre>2026-09-20 10:15:44 src=192.168.1.50 dst=91.215.12.88 proto=TCP dport=443 bytes=52428800 user=jdoe action=ALLOW</pre>
<p><strong>Questions:</strong></p>
<ol>
  <li>What is the source? What is the destination?</li>
  <li>How much data was transferred?</li>
  <li>What protocol/port is being used?</li>
  <li>Is this suspicious? Why or why not?</li>
</ol>

<div class="callout callout-info">
  <strong>Hint:</strong> 52,428,800 bytes = ~50 MB. An internal user sending 50 MB to an unknown external IP over HTTPS could be data exfiltration — or it could be a legitimate cloud backup. Context is everything.
</div>

<h2>8. Quick Revision</h2>
<ul>
  <li>Logs are records of events on systems and networks.</li>
  <li>Learn to read: timestamp, source/dest IP, user, port, action, event ID.</li>
  <li>Windows Event ID 4625 = failed logon (brute force indicator).</li>
  <li>Always ask: who, what, when, where, how much.</li>
  <li>A single log line rarely tells the full story — look for patterns.</li>
</ul>`
    }
  },

function calcOverallProgress() {
  const total = DATA.modules.reduce((sum, m) => sum + m.lessons, 0);
  const done = Object.keys(state.progress).length;
  return Math.min(100, Math.round((done / total) * 100));
}

function selectQuizOption(qIdx, optIdx) {
  quizAnswers[qIdx] = optIdx;
  const q = document.querySelector(`[data-q="${qIdx}"]`);
  q.querySelectorAll(".quiz-option").forEach((el, i) => {
    el.classList.toggle("selected", i === optIdx);
  });

function submitQuiz() {
  const moduleId = state.currentModule;
  const quiz = DATA.quizzes[moduleId];
  let correct = 0;

  quiz.forEach((q, i) => {
    const qEl = document.querySelector(`[data-q="${i}"]`);
    const options = qEl.querySelectorAll(".quiz-option");
    options.forEach((el, j) => {
      el.disabled = true;
      if (j === q.answer) el.classList.add("correct");
      else if (j === quizAnswers[i] && j !== q.answer) el.classList.add("incorrect");
    });
    document.getElementById(`exp-${i}`).classList.remove("hidden");
    if (quizAnswers[i] === q.answer) correct++;
  });

  const score = Math.round((correct / quiz.length) * 100);
  const passed = score >= 80;

  state.quizResults[moduleId] = { score, correct, total: quiz.length };
  if (passed) {
    state.progress["quiz-" + moduleId] = 1;
  }
  saveState();

  const resultEl = document.getElementById("quiz-result");
  resultEl.classList.remove("hidden");
  resultEl.innerHTML = `
    <div class="card-title" style="color: ${passed ? 'var(--green)' : 'var(--red)'}">
      ${passed ? '✅ Passed!' : '❌ Not quite yet'}
    </div>
    <div style="font-size: 24px; font-weight: 700; margin: 8px 0;">${score}%</div>
    <div class="text-sm text-muted">${correct} of ${quiz.length} correct. ${passed ? "Great work!" : "Review the explanations above and try again."}</div>

      ${!passed ? `<button class="btn btn-secondary" onclick="quizAnswers={}; navigate('quiz', {currentModule:'${moduleId}'})">Retry Quiz</button>` : ""}
      <button class="btn btn-primary" onclick="navigate('module', {currentModule:'${moduleId}'})">Back to Module</button>

  `;
  resultEl.scrollIntoView({ behavior: "smooth" });
}

function markFlashcard(known) {
  const idx = state.flashcardIndex;
  if (known) {
    if (!state.flashcardKnown.includes(idx)) state.flashcardKnown.push(idx);

  saveState();
  nextFlashcard();
}

        <li>Mapped real-world attack scenarios to the MITRE ATT&CK framework to understand adversary behavior.</li>
      </ul>
      <div class="callout callout-info mt-3">
        <strong>Tip:</strong> Customize these bullets based on the projects you actually complete. Interviewers will ask you to explain them.
      </div>
    </div>

    <button class="btn btn-primary mt-3" onclick="alert('Full resume export (PDF/DOCX) would be generated here based on your inputs.')">Generate Resume</button>
  `;
}

function viewReadiness() {
  const skills = {
    "Networking": 75, "Linux": 60, "Windows": 65, "SIEM": 50,
    "Log Analysis": 80, "Incident Response": 55, "Threat Intel": 60, "Interview": 45
  };
  const overall = Math.round(Object.values(skills).reduce((a,b) => a+b, 0) / Object.values(skills).length);

  return `
    ${renderTopbar("Job Readiness")}
    <div class="page-title">SOC L1 Job Readiness</div>
    <div class="page-subtitle">Based on your completed learning activities — not a guarantee of employment.</div>

    <div class="card mb-4">
      <div class="card-title mb-2">Overall Preparation</div>
      <div style="font-size: 48px; font-weight: 800; color: var(--accent); margin: 8px 0;">${overall}%</div>
      <div class="progress-bar" style="height: 12px;"><div class="progress-fill" style="width:${overall}%"></div></div>
      <div class="text-sm text-muted mt-3">This score reflects your progress through the learning platform. Actual job readiness depends on many factors including interview performance, projects, and market conditions.</div>
    </div>

    <div class="card">
      <div class="card-title mb-3">Skill Breakdown</div>
      ${Object.entries(skills).map(([name, pct]) => `
        <div style="margin-bottom: 14px;">
          <div class="progress-text"><span>${name}</span><span style="color: ${pct >= 75 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)'};">${pct}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      `).join("")}
    </div>

    <div class="card mt-3">
      <div class="card-title mb-2">Areas Needing Improvement</div>
      <ul style="color: var(--text-secondary); padding-left: 20px;">
        <li><strong>Interview preparation (45%)</strong> — Practice mock interviews and review scenario-based answers.</li>
        <li><strong>SIEM (50%)</strong> — Complete more SIEM query labs in Splunk and KQL.</li>
        <li><strong>Incident Response (55%)</strong> — Work through more IR playbooks and simulations.</li>
      </ul>
    </div>

    <div class="callout callout-info mt-3">
      <strong>Next steps:</strong> Focus on weak areas, complete 2-3 portfolio projects, practice interviews, and build a truthful resume. Job searching is a separate process — this platform prepares you with the skills.
    </div>
  `;
}

function viewCheatSheets() {
  return `
    ${renderTopbar("Cheat Sheets")}
    <div class="page-title">Cheat Sheets</div>
    <div class="page-subtitle">Quick reference guides for the most important SOC concepts.</div>

    <div class="grid grid-2">
      ${Object.entries(DATA.cheatSheets).map(([id, cs]) => `
        <div class="card" style="cursor:pointer;" onclick="openCheatSheet('${id}')">
          <div style="font-size: 28px; margin-bottom: 8px;">📋</div>
          <h3 style="font-size: 16px; margin-bottom: 4px;">${cs.title}</h3>
          <div class="text-sm text-muted">Click to view</div>
        </div>
      `).join("")}
    </div>
  `;
}

function openCheatSheet(id) {
  const cs = DATA.cheatSheets[id];
  const modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal">
      <div class="flex justify-between items-center mb-3">
        <h2>${cs.title}</h2>
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div class="lesson-content">${cs.content}</div>
      <button class="btn btn-primary mt-3" onclick="window.print()">Print / Save as PDF</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function openLessonStub(title) {
  const modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal">
      <div class="flex justify-between items-center mb-3">
        <h2>${title}</h2>

function viewGlossary() {
  return `
    ${renderTopbar("Glossary")}
    <div class="page-title">Cybersecurity Glossary</div>
    <div class="page-subtitle">Every term with simple definition, technical definition, example, and SOC relevance.</div>

    <div class="grid grid-2">
      ${Object.entries(DATA.glossary).map(([term, def]) => `
        <div class="card">
          <div style="font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 8px;">${term}</div>
          <div class="text-sm mb-2"><strong>Simple:</strong> ${def.simple}</div>
          <div class="text-sm mb-2" style="color: var(--text-secondary);"><strong>Technical:</strong> ${def.technical}</div>
          <div class="text-sm mb-2" style="color: var(--text-secondary);"><strong>Example:</strong> ${def.example}</div>
          <div class="text-xs text-muted"><strong>SOC relevance:</strong> ${def.soc}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function viewSearch() {
  const q = state.searchQuery.toLowerCase();
  let results = [];

  if (q) {
    // Search modules
    DATA.modules.forEach(m => {
      if (m.title.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q)) {
        results.push({ type: "Module", title: m.title, desc: m.desc, action: `navigate('module', {currentModule:'${m.id}'})` });
      }
    });
    // Search lessons
    Object.entries(DATA.lessons).forEach(([id, l]) => {
      if (l.title.toLowerCase().includes(q) || l.content.toLowerCase().includes(q)) {
        results.push({ type: "Lesson", title: l.title, desc: "Module " + l.moduleId, action: `navigate('lesson', {currentModule:'${l.moduleId}', currentLesson:'${id}'})` });
      }
    });
    // Search glossary
    Object.entries(DATA.glossary).forEach(([term, def]) => {
      if (term.toLowerCase().includes(q) || def.technical.toLowerCase().includes(q)) {
        results.push({ type: "Glossary", title: term, desc: def.simple, action: `navigate('glossary')` });
      }
    });
    // Search interview questions
    DATA.interviewQuestions.forEach(iq => {
      if (iq.q.toLowerCase().includes(q) || iq.answer.toLowerCase().includes(q)) {
        results.push({ type: "Interview Q", title: iq.q, desc: iq.category, action: `navigate('interview')` });
      }
    });
    // Search event IDs in content
    if (/\d{4}/.test(q)) {
      Object.entries(DATA.lessons).forEach(([id, l]) => {
        if (l.content.includes(q)) {
          results.push({ type: "Reference", title: `Contains "${q}"`, desc: l.title, action: `navigate('lesson', {currentModule:'${l.moduleId}', currentLesson:'${id}'})` });
        }
      });
    }
  }

  return `
    ${renderTopbar("Search")}
    <div class="page-title">Search</div>
    <div class="page-subtitle">Search across lessons, tools, interview questions, event IDs, and more.</div>

    <input type="text" value="${state.searchQuery}" onkeyup="state.searchQuery = this.value; if(event.key==='Enter') render();" placeholder="Try: '4625', 'phishing', 'SIEM', 'brute force'" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 12px 16px; border-radius: 8px; font-size: 15px; margin-bottom: 20px;">

    ${q ? `
      <div class="text-sm text-muted mb-3">${results.length} result${results.length !== 1 ? 's' : ''} for "${state.searchQuery}"</div>
      ${results.length === 0 ? '<div class="card">No results found. Try a different term.</div>' :
        results.map(r => `
          <div class="card" style="cursor:pointer;" onclick="${r.action}">
            <div class="flex items-center gap-3">
              <span class="badge badge-info">${r.type}</span>
              <div style="flex:1;">
                <div style="font-weight: 500;">${r.title}</div>
                <div class="text-xs text-muted mt-2">${r.desc}</div>
              </div>
              <div>→</div>
            </div>
          </div>
        `).join("")
      }
    ` : `
      <div class="card">
        <div class="card-title mb-2">Try searching for:</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          ${["4625", "phishing", "SIEM", "brute force", "MITRE", "TCP", "DNS", "ransomware"].map(t =>
            `<button class="btn btn-secondary btn-sm" onclick="state.searchQuery='${t}'; render();">${t}</button>`
          ).join("")}
        </div>
      </div>
    `}
  `;
}

/* ---------- RENDER ---------- */
function render() {
  renderSidebar();
  const main = document.getElementById("main");
  const views = {
    landing: viewLanding,
    dashboard: viewDashboard,
    roadmap: viewRoadmap,
    modules: viewModules,
    module: viewModule,
    lesson: viewLesson,
    quiz: viewQuiz,
    simulator: viewSimulator,
    alert: viewAlert,
    flashcards: viewFlashcards,
    interview: viewInterview,
    "mock-interview": viewMockInterview,
    projects: viewProjects,
    resume: viewResume,
    readiness: viewReadiness,
    cheatsheets: viewCheatSheets,
    glossary: viewGlossary,
    search: viewSearch
  };
  const viewFn = views[state.currentView] || viewLanding;
  main.innerHTML = viewFn();
}

/* ---------- INIT ---------- */
render();
</script>
</body>
